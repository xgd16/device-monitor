[Service]
Environment=RUST_LOG=info
ExecStart=
ExecStart=/home/user/code/device-monitor/device-monitor-launcher.sh
# 关键：不要把服务输出写到 tty1 —— 写 tty1 会触发 fbcon 重画控制台，覆盖面板上的仪表。
# 因此输出改到 journal（用 journalctl -u device-monitor 查看）。
StandardInput=null
StandardOutput=journal
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes

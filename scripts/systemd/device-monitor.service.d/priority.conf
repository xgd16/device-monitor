[Unit]
# 开机优先级：面板先画上屏，其它设备服务排在后面起。
# 这些单元都是 multi-user.target，且彼此没有对 device-monitor 的 After，不会成环。
Before=update-sub.service mihomo.service mijia.service idea-vault.service
Before=obsidian-viewer.service syncthing.service wallpaper-engine.service
Before=110jump.service baby-records.service xtokenhub.service wait-ntp-sync.service

[Service]
# 开机那几秒 CPU/IO 全被别的服务抢，面板首帧会被拖到 20s+：给它最高权重。
Nice=-10
CPUWeight=10000
IOWeight=10000
OOMScoreAdjust=-500

[Unit]
# 2026-11-18：移除 After=/Wants=network-online.target
#   旧行为：WiFi 没连上时 nm-online 要等满 30s 才放行，这段时间面板根本没启动，
#   屏幕一直是黑的；而"亮屏时刻"恰好等于"WiFi 连上时刻"，看起来就像没 WiFi 就不亮屏。
#   面板只依赖本机 API(127.0.0.1:3000) 与 sysfs，WLAN 状态由 Wi-Fi 卡片每 10s 轮询、
#   连上后自动回填，没有必要阻塞显示。
#
# 2026-11-18（第二版）：连 After=network.target 也去掉
#   network.target 只是"网络栈已启动"，本项目不需要它就能画首帧；
#   去掉后 device-monitor 在 basic.target(≈10.7s) 就能起，比原来早 0.5~1s。

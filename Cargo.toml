[package]
name = "device-monitor-server"
version = "0.2.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
sysinfo = "0.39"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
libc = "0.2.186"
portable-pty = "0.8"
zip = "8.6.0"
sevenz-rust = "0.6.1"

[[bin]]
name = "device-monitor-server"
path = "src/main.rs"

# GPU 物理屏面板（Slint + femtovg）：独立 crate，macOS 上用 winit 预览
[workspace]
members = ["panel"]
# root 也是 package 时，cargo 的默认成员只有 root——面板会被漏掉（实测
# `cargo build --release` 不会生成 target/release/device-monitor-panel）。
# 显式把两个成员都设为默认，AGENTS.md / build.sh 里的
# `cargo build --release` 才是「服务端 + 面板」一起编。
default-members = [".", "panel"]
